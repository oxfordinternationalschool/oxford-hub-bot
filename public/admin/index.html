<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Oxford Hub — Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Own minimal palette (not Telegram's), light and dark. */
  :root {
    --bg: #f5f5f7; --surface: #ffffff; --surface-2: #f0f0f3; --text: #111114; --muted: #6e6e78;
    --line: rgba(17, 17, 20, .07); --accent: #4f46e5; --accent-2: #6d63ff; --accent-soft: rgba(79, 70, 229, .1);
    --on-accent: #ffffff; --ok: #12a150; --ok-soft: rgba(18, 161, 80, .12); --warn: #d97706; --warn-soft: rgba(217, 119, 6, .13);
    --danger: #e5484d; --danger-soft: rgba(229, 72, 77, .12); --shadow: 0 1px 2px rgba(17, 17, 20, .04), 0 8px 24px rgba(17, 17, 20, .05);
    --radius: 18px; --nav-h: 64px;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0c0c0f; --surface: #16161b; --surface-2: #1f1f26; --text: #f4f4f6; --muted: #9a9aa5;
    --line: rgba(255, 255, 255, .07); --accent: #7c74ff; --accent-2: #9a93ff; --accent-soft: rgba(124, 116, 255, .16);
    --ok: #3ccf7e; --ok-soft: rgba(60, 207, 126, .14); --warn: #f2a33a; --warn-soft: rgba(242, 163, 58, .15);
    --danger: #ff6b6f; --danger-soft: rgba(255, 107, 111, .14); --shadow: none;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: -.005em;
    padding-bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));
    overflow-x: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

  /* Page header */
  .page-h { padding: 18px 2px 10px; display: flex; align-items: center; gap: 12px; }
  .page-h h1 { font-size: 28px; line-height: 1.15; margin: 0; letter-spacing: -.02em; font-weight: 750; flex: 1; }
  .page-h .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--surface); color: var(--text);
    display: grid; place-items: center; box-shadow: var(--shadow); }
  .icon-btn:active { transform: scale(.96); }

  /* Bottom navigation */
  nav.bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.8) blur(18px);
    -webkit-backdrop-filter: saturate(1.8) blur(18px); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.bottom .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
  nav.bottom button {
    border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; position: relative;
  }
  nav.bottom button.on { color: var(--accent); }
  nav.bottom .dot { position: absolute; top: 9px; left: calc(50% + 7px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
    background: var(--danger); color: #fff; font-size: 10px; line-height: 16px; text-align: center; }

  /* Cards & lists */
  .h { display: flex; align-items: center; justify-content: space-between; margin: 22px 4px 8px; }
  .h span { font-size: 13px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .h button { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; padding: 0; }
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .card.pad { padding: 16px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 60px; width: 100%;
    border: 0; background: none; text-align: left; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 64px; right: 0; height: 1px; background: var(--line); }
  .row.flat + .row.flat::before { left: 16px; }
  button.row:active { background: var(--surface-2); }
  .row .main { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; overflow-wrap: anywhere; }
  .row .sub { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
  .row .side { color: var(--muted); font-size: 13px; flex: none; text-align: right; }
  .row .chev { color: var(--muted); opacity: .6; }
  .lead { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none;
    background: var(--accent-soft); color: var(--accent); font-size: 17px; }
  .lead.ok { background: var(--ok-soft); color: var(--ok); } .lead.warn { background: var(--warn-soft); color: var(--warn); }
  .side-btns { display: flex; gap: 8px; }
  .lead.bad { background: var(--danger-soft); color: var(--danger); }
  .tick { width: 26px; height: 26px; margin: 5px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center;
    flex: none; color: var(--on-accent); opacity: .7; }
  .tick.on { background: var(--accent); border-color: var(--accent); opacity: 1; }
  .tick.done { background: var(--ok); border-color: var(--ok); opacity: 1; }
  .tick.off { border-style: dashed; opacity: .3; }
  .tick svg.i { width: 15px; height: 15px; } .lead svg.i { width: 19px; height: 19px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none;
    color: #fff; font-weight: 700; font-size: 15px; }
  .empty { padding: 28px 16px; color: var(--muted); text-align: center; font-size: 14px; }
  .empty svg.i { width: 30px; height: 30px; display: block; margin: 0 auto 8px; opacity: .55; }

  /* Home */
  .hello { padding: 22px 2px 6px; }
  .hello .d { color: var(--muted); font-size: 14px; }
  .hello h1 { margin: 2px 0 0; font-size: 28px; letter-spacing: -.02em; font-weight: 750; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .kpi { background: var(--surface); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); border: 0; text-align: left; }
  .kpi .lead { margin-bottom: 12px; }
  .kpi b { display: block; font-size: 26px; line-height: 1; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--muted); font-size: 13px; display: block; margin-top: 5px; }
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .quick button { border: 0; background: var(--surface); border-radius: var(--radius); padding: 14px 8px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .quick button:active, .kpi:active { transform: scale(.98); }

  /* Pills, chips, badges */
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips.wrap-ok { flex-wrap: wrap; overflow: visible; }
  .chip { flex: none; border: 0; border-radius: 999px; padding: 8px 14px; background: var(--surface); color: var(--text);
    font-size: 14px; font-weight: 550; box-shadow: var(--shadow); white-space: nowrap; }
  .chip.on { background: var(--text); color: var(--bg); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); padding: 3px; border-radius: 12px; }
  .seg button { border: 0; background: none; padding: 8px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; padding: 3px 8px; border-radius: 999px;
    background: var(--surface-2); color: var(--muted); margin: 4px 4px 0 0; vertical-align: middle; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.bad { background: var(--danger-soft); color: var(--danger); } .badge.acc { background: var(--accent-soft); color: var(--accent); }

  /* Buttons & forms */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px;
    padding: 0 18px; min-height: 50px; background: var(--accent); color: var(--on-accent); font-weight: 650; font-size: 15px; }
  .btn:active { transform: scale(.985); }
  .btn.block { width: 100%; }
  .btn.soft { background: var(--accent-soft); color: var(--accent); }
  .btn.ghost { background: var(--surface-2); color: var(--text); }
  .btn.danger { background: var(--danger-soft); color: var(--danger); }
  .btn.sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 11px; }
  .btn:disabled { opacity: .5; }
  .btns { display: flex; gap: 10px; } .btns > .btn { flex: 1; }
  label.f { display: block; margin-top: 14px; }
  label.f > span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 6px 2px; }
  .in { width: 100%; border: 1.5px solid transparent; background: var(--surface-2); border-radius: 13px; padding: 12px 14px;
    outline: none; min-height: 48px; transition: border-color .15s; }
  .in:focus { border-color: var(--accent); background: var(--surface); }
  textarea.in { min-height: 130px; resize: vertical; line-height: 1.5; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 6px 2px 0; }
  .search { position: relative; }
  .search svg.i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 19px; height: 19px; }
  .search .in { padding-left: 42px; background: var(--surface); box-shadow: var(--shadow); }
  .switch { position: relative; display: inline-block; vertical-align: middle; width: 50px; height: 30px; flex: none; }
  .switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-2); transition: background .2s; pointer-events: none;
    box-shadow: inset 0 0 0 1px var(--line); }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.25); transition: transform .2s; }
  .switch input:checked + i { background: var(--accent); }
  .switch input:checked + i::after { transform: translateX(20px); }

  /* Stats */
  .bar-row { display: grid; grid-template-columns: 64px 1fr 28px; gap: 10px; align-items: center; padding: 10px 16px; font-size: 14px; }
  .bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); min-width: 6px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t th, table.t td { padding: 11px 12px; text-align: right; font-variant-numeric: tabular-nums; }
  table.t tr + tr td { border-top: 1px solid var(--line); }
  table.t th { color: var(--muted); font-weight: 600; font-size: 12px; }
  table.t td:first-child, table.t th:first-child { text-align: left; }

  .linkbox { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all;
    padding: 12px 14px; background: var(--surface-2); border-radius: 12px; margin: 10px 0 12px; }

  /* Sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--bg); border-radius: 24px 24px 0 0;
    max-height: 90vh; overflow-y: auto; transform: translateY(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
    padding: 8px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  .sheet.open { transform: translateY(0); } .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 14px; filter: contrast(3); }
  .sheet .top { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .sheet h2 { font-size: 21px; margin: 0; letter-spacing: -.015em; flex: 1; }

  /* Custom select: a field-looking button that opens a list sheet above everything */
  .pick { width: 100%; display: flex; align-items: center; gap: 10px; border: 1.5px solid transparent; background: var(--surface-2);
    border-radius: 13px; padding: 0 14px; min-height: 48px; text-align: left; font-weight: 550; }
  .pick span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick svg.i { color: var(--muted); width: 18px; height: 18px; transform: rotate(90deg); }
  .pick:active { border-color: var(--accent); }
  .picker-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .picker { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--bg); border-radius: 24px 24px 0 0;
    max-height: 70vh; overflow-y: auto; transform: translateY(100%); transition: transform .22s cubic-bezier(.2,.8,.2,1);
    padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  .picker.open { transform: translateY(0); } .picker-bg.open { opacity: 1; pointer-events: auto; }
  .picker h3 { font-size: 17px; margin: 4px 4px 12px; }
  .opt { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 14px 16px; text-align: left;
    font-size: 15.5px; position: relative; }
  .opt + .opt::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
  .opt span { flex: 1; } .opt svg.i { color: var(--accent); width: 20px; height: 20px; }
  .opt.on { font-weight: 650; } .opt:active { background: var(--surface-2); }

  /* Rich text editor */
  .toolbar { display: flex; align-items: center; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--line); overflow-x: auto;
    scrollbar-width: none; position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .toolbar::-webkit-scrollbar { display: none; }
  .tool { flex: none; min-width: 36px; height: 36px; border: 0; border-radius: 10px; background: none; color: var(--text);
    font-size: 16px; display: grid; place-items: center; padding: 0 6px; }
  .tool svg.i { width: 18px; height: 18px; } .tool:active { background: var(--surface-2); }
  .tool.on { background: var(--accent-soft); color: var(--accent); }
  .tsep { flex: none; width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  .editor { min-height: 140px; max-height: 50vh; overflow-y: auto; outline: none; font-size: 16px; line-height: 1.5;
    padding: 2px 2px 6px; overflow-wrap: anywhere; }
  .editor:empty::before { content: attr(data-ph); color: var(--muted); pointer-events: none; }
  .editor blockquote, .pv-text blockquote { margin: 6px 0; padding: 4px 10px; border-left: 3px solid var(--accent);
    background: var(--accent-soft); border-radius: 0 8px 8px 0; }
  .editor ul, .editor ol { margin: 4px 0; padding-left: 22px; }
  .editor a, .pv-text a { color: var(--accent); }

  /* Attachment tiles */
  .tiles { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 2px; margin-top: 8px; scrollbar-width: none; }
  .tiles::-webkit-scrollbar { display: none; }
  .tile { position: relative; flex: none; width: 76px; height: 76px; border-radius: 14px; background: var(--surface-2) center / cover no-repeat;
    display: grid; place-items: center; border: 0; overflow: hidden; }
  .row .tile { width: 44px; height: 44px; border-radius: 11px; }
  .tile .emo { font-size: 26px; } .row .tile .emo { font-size: 19px; }
  .tile .dur { position: absolute; left: 5px; bottom: 5px; font-size: 10.5px; font-weight: 700; color: #fff; background: rgba(0,0,0,.55);
    padding: 1px 5px; border-radius: 6px; }
  .row .tile .dur { display: none; }
  .tile .rm { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6);
    color: #fff; display: grid; place-items: center; padding: 0; }
  .tile .rm svg.i { width: 13px; height: 13px; stroke-width: 2.4; }
  .tile.add { border: 1.5px dashed var(--line); background: none; color: var(--accent); font-size: 11.5px; font-weight: 650;
    display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; filter: contrast(1.4); }

  /* Preview (Telegram-like) */
  .pv-chat { border-radius: 18px; padding: 12px 10px 14px; margin-top: 4px;
    background: linear-gradient(160deg, #b9d3a8 0%, #d6e4b5 45%, #a8c99c 100%); }
  :root[data-theme="dark"] .pv-chat { background: linear-gradient(160deg, #0f1a24 0%, #182633 50%, #0f1a24 100%); }
  .pv-head { display: flex; align-items: center; gap: 10px; margin: 0 4px 10px; color: #1b2a12; }
  :root[data-theme="dark"] .pv-head { color: #e8eef3; }
  .pv-bubble { background: #fff; color: #111; border-radius: 16px 16px 16px 6px; padding: 8px 10px 6px; max-width: 88%; margin-top: 6px;
    box-shadow: 0 1px 1px rgba(0,0,0,.12); overflow: hidden; }
  :root[data-theme="dark"] .pv-bubble { background: #212d3b; color: #f1f4f7; }
  .pv-bubble.media { padding: 3px 3px 6px; } .pv-bubble.media .pv-text { padding: 6px 7px 0; }
  .pv-text { white-space: normal; font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
  .pv-meta { text-align: right; font-size: 11.5px; opacity: .55; margin: 2px 4px 0; }
  .pv-grid { display: grid; gap: 2px; border-radius: 13px; overflow: hidden; }
  .pv-grid.n1 { grid-template-columns: 1fr; } .pv-grid.n2, .pv-grid.n4 { grid-template-columns: 1fr 1fr; }
  .pv-grid.n3 { grid-template-columns: 1fr 1fr; } .pv-grid.n3 .pv-cell:first-child { grid-column: span 2; }
  .pv-grid.n5 { grid-template-columns: repeat(3, 1fr); }
  .pv-cell { aspect-ratio: 1; background: #cfd8dc center / cover no-repeat; display: grid; place-items: center; font-size: 28px; position: relative; }
  .pv-grid.n1 .pv-cell { aspect-ratio: 4 / 3; }
  .pv-play { position: absolute; width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff; font-size: 15px;
    display: grid; place-items: center; }
  .pv-slide { position: relative; border-radius: 13px; overflow: hidden; }
  .pv-slide .pv-cell { aspect-ratio: 4 / 3; }
  .pv-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.45); color: #fff; display: grid; place-items: center; padding: 0; }
  .pv-arrow.l { left: 8px; } .pv-arrow.r { right: 8px; } .pv-arrow svg.i { width: 18px; height: 18px; stroke-width: 2.4; }
  .pv-count { position: absolute; top: 8px; right: 8px; font-size: 11.5px; font-weight: 700; color: #fff; background: rgba(0,0,0,.45);
    padding: 2px 7px; border-radius: 8px; }
  .pv-dots { display: flex; justify-content: center; gap: 5px; margin: 7px 0 2px; }
  .pv-dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .25; }
  .pv-dots i.on { opacity: .8; }
  .pv-grid.collage { gap: 4px; padding: 2px; }
  .pv-grid.collage .pv-cell { border-radius: 9px; }
  .pv-file { display: flex; align-items: center; gap: 10px; padding: 6px 7px; }
  .pv-ic { width: 42px; height: 42px; border-radius: 50%; background: #3390ec; color: #fff; display: grid; place-items: center; flex: none; font-size: 17px; }
  .pv-name { font-weight: 600; font-size: 14.5px; } .pv-sub { font-size: 12.5px; opacity: .6; }
  .pv-wave { display: flex; align-items: center; gap: 2px; flex: 1; height: 24px; }
  .pv-wave i { width: 3px; border-radius: 2px; background: #3390ec; opacity: .8; }

  /* Attachment chip */
  .att { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: var(--accent-soft); margin-top: 10px; }
  .att .main { flex: 1; min-width: 0; } .att .title { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att .sub { color: var(--muted); font-size: 12.5px; }
  .att-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }

  .toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom)); z-index: 40;
    transform: translateX(-50%) translateY(16px); background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 14px;
    font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s, transform .2s; max-width: 90vw; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .center { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    color: var(--muted); padding: 24px; gap: 10px; }
  .skel { background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%;
    animation: sh 1.2s linear infinite; border-radius: var(--radius); }

function el(tag, props, ...kids) {

    if (v == null || v === false) continue;

    else if (k === "value") n.value = v;  // property, so it also works for <textarea>
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k in n && typeof v !== "string") n[k] = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    n.append(c instanceof Node ? c : String(c));

const escHtml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/** The editor's DOM as Telegram HTML + plain text (what the caption limit counts). */
function editorToTg(root) {
  let html = "", plain = "";
  const out = (h, p = "") => { html += h; plain += p; };
  const nl = () => { if (plain && !plain.endsWith("\n")) out("\n", "\n"); };
  const WRAP = { B: "b", STRONG: "b", I: "i", EM: "i", U: "u", S: "s", STRIKE: "s", DEL: "s" };
  const walk = (node) => {
    for (const n of node.childNodes) {
      if (n.nodeType === 3) { out(escHtml(n.nodeValue), n.nodeValue); continue; }
      if (n.nodeType !== 1) continue;
      const tag = n.nodeName;
      if (tag === "BR") { out("\n", "\n"); continue; }
      if (tag === "UL" || tag === "OL") {
        nl(); let i = 0;
        for (const li of n.children) { i++; const mark = tag === "UL" ? "• " : `${i}. `; out(mark, mark); walk(li); nl(); }
        continue;
      }
      if (tag === "BLOCKQUOTE") { nl(); out("<blockquote>"); walk(n); out("</blockquote>"); nl(); continue; }
      if (tag === "DIV" || tag === "P") { nl(); walk(n); nl(); continue; }
      if (tag === "A") {
        const href = n.getAttribute("href") || "";
        if (SAFE_HREF.test(href)) { out(`<a href="${escHtml(href).replace(/"/g, "&quot;")}">`); walk(n); out("</a>"); } else walk(n);
        continue;
      }
      const wraps = WRAP[tag] ? [WRAP[tag]] : [];

        if (n.style.fontWeight === "bold" || +n.style.fontWeight >= 600) wraps.push("b");
        if (n.style.fontStyle === "italic") wraps.push("i");
        const deco = n.style.textDecorationLine || n.style.textDecoration || "";
        if (deco.includes("underline")) wraps.push("u");
        if (deco.includes("line-through")) wraps.push("s");
      }
      const uniq = [...new Set(wraps)];
      uniq.forEach((w) => out(`<${w}>`)); walk(n); uniq.reverse().forEach((w) => out(`</${w}>`));

function tgToNodes(html) {
  const doc = new DOMParser().parseFromString(`<body>${html || ""}</body>`, "text/html");
  const KEEP = { B: "b", I: "i", U: "u", S: "s", BLOCKQUOTE: "blockquote", CODE: "code", "TG-SPOILER": "span" };
  const build = (src, dst) => {
    for (const n of src.childNodes) {
      if (n.nodeType === 3) {
        n.nodeValue.split("\n").forEach((part, i) => { if (i) dst.append(el("br")); if (part) dst.append(part); });
      } else if (n.nodeType === 1) {
        let target;
        if (n.nodeName === "A" && SAFE_HREF.test(n.getAttribute("href") || "")) target = el("a", { href: n.getAttribute("href") });

      }

  build(doc.body, frag);

    return el("div", { class: "pv-chat" }, el("div", { class: "pv-head" }, lead("school"), el("b", {}, groupName)), bubbles);
  }
  if (media.length) {
    const visual = media.filter((d) => ALBUM_FAMILY[d.kind] === "visual" || d.kind === "animation" || d.kind === "video_note");
    let body;
    if (visual.length === media.length) {

        const cell = el("div", { class: "pv-cell" });

      }));
    } else {
      body = el("div", {}, media.map((d) => d.kind === "voice"
        ? el("div", { class: "pv-file" }, el("span", { class: "pv-ic" }, "▶"),
            el("div", { class: "pv-wave" }, Array.from({ length: 28 }, (_, i) => el("i", { style: `height:${4 + ((i * 7) % 13)}px` }))),
            el("span", { class: "pv-sub" }, fmtDur(d.duration)))
        : el("div", { class: "pv-file" }, el("span", { class: "pv-ic" }, KIND_EMOJI[d.kind] || "📎"),
            el("div", {}, el("div", { class: "pv-name" }, draftTitle(d)), el("div", { class: "pv-sub" }, t("m_" + d.kind))))));
    }
    bubbles.push(el("div", { class: "pv-bubble media" }, body, fits && plain ? caption(html) : null, meta.cloneNode(true)));
    if (!fits && plain) bubbles.push(el("div", { class: "pv-bubble" }, caption(html), meta.cloneNode(true)));
  } else if (plain) {
    bubbles.push(el("div", { class: "pv-bubble" }, caption(html), meta));
  }
  return el("div", { class: "pv-chat" }, el("div", { class: "pv-head" }, lead("school"), el("b", {}, groupName)), bubbles);
}

  async announce() {

    const counter = el("span", {});
    const sendBtn = el("button", { class: "btn block", type: "button" });
    const pickedLabel = el("div", { class: "sub" });
    // A story goes to the school's Telegram account, and only a photo can become one.
    const storyBox = el("div", {});
    const storyOn = () => state.annStory && !!me.story_account && state.annMedia.some((d) => d.kind === "photo");
    const drawStory = () => storyBox.replaceChildren(me.story_account && state.annMedia.some((d) => d.kind === "photo")
      ? row({ lead: lead("story", "ok"), title: t("story_toggle"), sub: t("story_sub", { name: me.story_account }),
          side: toggle(state.annStory, (v) => { state.annStory = v; haptic(); }) })
      : "");
    const current = () => editorToTg(editor);
    // Once sent, the screen is drawn anew with an empty editor; this old screen must not write
    // its text back into the draft afterwards, or the sent announcement would come back.
    let done = false;
    const updateUi = () => {
      if (done) return;
      const { html, plain } = current();
      state.annHtml = html; saveAnnDraft();
      const limit = state.annMedia.length && effectiveLayout() === "album" ? 1024 : 4096;
      counter.textContent = `${plain.length}/${limit}`;
      counter.style.color = plain.length > limit ? "var(--warn)" : "";
      sendBtn.textContent = sel.size ? t("ann_send_n", { n: sel.size }) : t("ann_send");
      pickedLabel.textContent = sel.size ? t("ann_picked", { n: sel.size }) : t("ann_none_picked");
    };
    editor.addEventListener("input", updateUi);
    editor.addEventListener("paste", (e) => {  // keep pasted text plain; formatting comes from the toolbar
      e.preventDefault();
      document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text/plain"));
    });

    const exec = (cmd, arg) => { editor.focus(); document.execCommand(cmd, false, arg); haptic(); updateUi(); syncTools(); };
    let savedRange = null;
    const keepRange = () => { const s = getSelection(); if (s.rangeCount && editor.contains(s.anchorNode)) savedRange = s.getRangeAt(0).cloneRange(); };
    const restoreRange = () => { editor.focus(); if (savedRange) { const s = getSelection(); s.removeAllRanges(); s.addRange(savedRange); } };
    const insideTag = (tag) => { let n = getSelection().anchorNode; while (n && n !== editor) { if (n.nodeName === tag) return true; n = n.parentNode; } return false; };
    const openLink = () => {
      keepRange();
      const selected = savedRange ? savedRange.toString() : "";
      const url = el("input", { class: "in", type: "url", placeholder: "https://", autocapitalize: "off", inputmode: "url" });
      const label = el("input", { class: "in", value: selected, placeholder: t("link_text") });
      const save = el("button", { class: "btn block mt", type: "button", onclick: () => {
        let href = url.value.trim();
        if (href && !/^(https?|tg):\/\//i.test(href)) href = "https://" + href;
        if (!SAFE_HREF.test(href)) return alertMsg(t("link_bad"));
        closeSheet(); restoreRange();
        if (getSelection().isCollapsed) document.execCommand("insertHTML", false,
          `<a href="${escHtml(href).replace(/"/g, "&quot;")}">${escHtml(label.value.trim() || href)}</a>`);
        else document.execCommand("createLink", false, href);
        haptic("ok"); updateUi();
      } }, t("save"));
      openSheet(t("link_title"), field(t("link_url"), url), field(t("link_text"), label), save);

    };
    const TOOLS = [
      ["undo", () => exec("undo"), "↶"], ["redo", () => exec("redo"), "↷"], null,
      ["bold", () => exec("bold"), el("b", {}, "B")], ["italic", () => exec("italic"), el("i", {}, "I")],
      ["underline", () => exec("underline"), el("u", {}, "U")], ["strikeThrough", () => exec("strikeThrough"), el("s", {}, "S")], null,
      ["link", openLink, icon("link")],
      ["quote", () => exec("formatBlock", insideTag("BLOCKQUOTE") ? "div" : "blockquote"), "❝"],
      ["insertUnorderedList", () => exec("insertUnorderedList"), "•≡"], ["insertOrderedList", () => exec("insertOrderedList"), "1≡"], null,
      ["clear", () => { exec("removeFormat"); exec("formatBlock", "div"); }, "⌫"],
    ];
    const toolBtns = {};
    const toolbar = el("div", { class: "toolbar" }, TOOLS.map((tool) => {
      if (!tool) return el("span", { class: "tsep" });
      const [name, fn, glyph] = tool;
      const b = el("button", { type: "button", class: "tool", "aria-label": name,
        onpointerdown: (e) => { e.preventDefault(); keepRange(); },  // keep the text selection
        onclick: () => fn() }, glyph);
      toolBtns[name] = b;
      return b;
    }));
    const syncTools = () => {
      for (const cmd of ["bold", "italic", "underline", "strikeThrough", "insertUnorderedList", "insertOrderedList"]) {
        try { toolBtns[cmd].classList.toggle("on", document.queryCommandState(cmd)); } catch {}
      }
      if (editor.contains(getSelection().anchorNode)) toolBtns.quote.classList.toggle("on", insideTag("BLOCKQUOTE"));
    };
    if (selectionHandler) document.removeEventListener("selectionchange", selectionHandler);
    selectionHandler = syncTools;
    document.addEventListener("selectionchange", syncTools);

    // ---- attachments (one file, or an album of up to 10)
    const attBox = el("div");
    const fileInput = el("input", { type: "file", multiple: true, style: "display:none",
      accept: "image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip" });
    const addDraft = (d) => {
      if (state.annMedia.some((m) => m.id === d.id)) return true;
      const problem = albumProblem(state.annMedia, d);
      if (problem) { alertMsg(problem); return false; }
      state.annMedia.push(d); return true;
    };
    const drawAtt = () => {
      const m = state.annMedia;
      const add = el("button", { class: "tile add", type: "button", onclick: openAttach }, icon("plus"), el("span", {}, t("att_add")));
      const layoutBox = canRichLayout(m) ? el("div", { class: "mt" },
        seg([["album", t("layout_album")], ["slideshow", t("layout_slideshow")], ["collage", t("layout_collage")]], state.annLayout,
          (v) => { state.annLayout = v; drawAtt(); updateUi(); }),
        el("div", { class: "hint" }, t("layout_hint_" + state.annLayout))) : null;
      attBox.replaceChildren(m.length
        ? el("div", {}, el("div", { class: "tiles" }, m.map((d, i) => tile(d, () => { m.splice(i, 1); haptic(); drawAtt(); updateUi(); })),
            m.length < ALBUM_MAX ? add : null),
          layoutBox || el("div", { class: "hint" }, m.length > 1 ? t("att_album_hint", { n: m.length }) : t("att_caption_hint")))
        : el("div", { class: "att-btns" },
            el("button", { class: "btn ghost", type: "button", onclick: () => fileInput.click() }, icon("plus"), t("att_phone")),
            el("button", { class: "btn ghost", type: "button", onclick: openAttach }, icon("inbox"), t("att_bot"))));
      drawStory();

    fileInput.addEventListener("change", () => act(null, async () => {
      const files = [...fileInput.files]; fileInput.value = "";
      for (const [i, file] of files.entries()) {
        toast(t("att_uploading", { i: i + 1, n: files.length }));
        const draft = await uploadFile(file);
        if (!draft) { await alertMsg(`${file.name}: ${t("att_too_big")}`); continue; }
        if (!addDraft(draft)) break;
        drawAtt(); updateUi();
      }
      haptic("ok");
    }));
    function openAttach() {
      closeSheet();
      const chosen = new Set();
      const list = el("div", { class: "card" }, el("div", { class: "skel", style: "height:64px;border-radius:0" }));
      const pick = el("button", { class: "btn block mt", type: "button" });
      const syncPick = () => { pick.textContent = t("att_pick_n", { n: chosen.size }); pick.disabled = !chosen.size; };
      let drafts = [];
      const drawList = () => list.replaceChildren(...(drafts.length ? drafts.map((d) => row({
        lead: tile(d), title: draftTitle(d),
        sub: [t("m_" + d.kind), fmtDur(d.duration), ago(d.created_at)].filter(Boolean).join(" · "),
        side: toggle(chosen.has(d.id), (v, input) => {

            if (problem) { input.checked = false; return alertMsg(problem); }

          } else chosen.delete(d.id);

      const loadDrafts = async () => {

      openSheet(t("att_title"),

          botName ? el("button", { class: "btn ghost", type: "button", onclick: () => {

    loadThumbs(state.annMedia).then(drawAtt).catch(() => {});

    // ---- groups
    const grades = [...new Set(groups.map((g) => g.grade).filter(Boolean))].sort((a, b) => a - b);

        const allOn = ids.every((id) => sel.has(id));

      quickChips.replaceChildren(
        chip(t("ann_all"), all, groups.map((g) => g.chat_id)),
        ...grades.map((gr) => {
          const ids = groups.filter((g) => g.grade === gr).map((g) => g.chat_id);

    const openGroupPicker = () => {
      const list = el("div", { class: "card" }, groups.map((g) => row({
        flat: true, title: groupLabel(g), sub: g.class_name && g.title !== g.class_name ? g.title : null,
        side: toggle(sel.has(g.chat_id), (v) => { v ? sel.add(g.chat_id) : sel.delete(g.chat_id); haptic(); drawChips(); updateUi(); }),
      })));
      openSheet(t("ann_pick"), list, el("button", { class: "btn block mt", type: "button", onclick: closeSheet }, t("done")));

    // ---- preview & send
    const validate = () => {
      const { plain } = current();
      if (!plain && !state.annMedia.length) return t("ann_need_text");

      const { html, plain } = current();

        sel.size ? el("button", { class: "btn block mt", type: "button", onclick: () => { closeSheet(); sendBtn.click(); } },
          t("ann_send_n", { n: sel.size })) : el("div", { class: "hint mt" }, t("ann_need_groups")));
    };
    // The button is busy only while the request runs (not while the confirm dialog is open),
    // and the API call times out, so it can never stay stuck.
    let sending = false;
    sendBtn.addEventListener("click", async () => {
      if (sending) return;
      const problem = validate();
      if (problem) return alertMsg(problem);
      if (!(await confirmMsg(t("ann_confirm", { n: sel.size })))) return;
      sending = true;
      sendBtn.textContent = t("sending");
      act(sendBtn, doSend).finally(() => { sending = false; updateUi(); });
    });
    const doSend = async () => {
      const { html } = current();
      const r = await api("announce.send", { html, chat_ids: [...sel], pin: state.annPin, media_ids: state.annMedia.map((m) => m.id),

        await alertMsg([
          t("ann_sent", { sent: r.sent, total: r.total }),
          r.failed.length ? t("ann_failed", { list: r.failed.join(", ") }) : "",
          r.pin_failed.length ? t("ann_pin_failed", { list: r.pin_failed.join(", ") }) : "",

    // A sent announcement opens a sheet: fix its text everywhere, or delete it from chosen groups.
    const historyRows = history.slice(0, 10).map((a) => row({

      sub: [`${fmtTime(a.created_at)} · ${t("ann_groups", { n: a.groups })}`, a.deleted ? [" ", badge(t("ann_deleted_badge"), "bad")] : null],
      onclick: () => act(null, () => openAnnouncement(a, shareStory)), chevron: true,
    }));

    return [
      pageHead(t("ann_title")),
      card(toolbar, el("div", { style: "padding:12px 14px 14px" }, editor,

        storyBox),
      el("div", { class: "btns mt" }, el("button", { class: "btn ghost", type: "button", style: "flex:none;padding:0 16px", onclick: openPreview },

  async staff() {
    const [users, roles, floors] = await Promise.all([load("users", "staff.list"), load("roles", "roles.list"), load("floors", "floors.list")]);
    const list = el("div", { class: "card" });
    const search = el("input", { class: "in", type: "search", placeholder: t("search"), value: state.staffQuery });
    // People with no right or role (students who just pressed Start) are kept apart under "No role";
    // a search still finds them, so one can be given a role.
    const isGuest = (u) => !u.is_admin && !u.can_announce && !u.is_teacher && !u.roles.length;
    const guests = users.filter(isGuest).length;
    const filters = [["all", t("f_staff")], ["admin", t("perm_admin")], ["teacher", t("perm_teacher")], ["announcer", t("perm_announcer")],
      ...roles.map((r) => ["role:" + r.id, `${r.emoji} ${r.name}`]), ...(guests ? [["guest", t("f_guests", { n: guests })]] : [])];
    const chips = el("div", { class: "chips mt" });
    const matches = (u) => {
      const f = state.staffFilter;
      const q = state.staffQuery.trim().toLowerCase().replace(/^@/, "");
      if (f === "all" && !q && isGuest(u)) return false;
      if (f === "guest" && !isGuest(u)) return false;
      if (f === "admin" && !u.is_admin) return false;
      if (f === "announcer" && !u.can_announce) return false;
      if (f === "teacher" && !u.is_teacher) return false;
      if (f.startsWith("role:") && !u.roles.some((r) => r.role_id === Number(f.slice(5)))) return false;
      return !q || u.name.toLowerCase().includes(q) || (u.username || "").toLowerCase().includes(q) || String(u.id).includes(q);
    };
    const summary = (u) => [
      u.is_admin ? t("perm_admin") : null, u.can_announce ? t("perm_announcer") : null, u.is_teacher ? t("perm_teacher") : null,
      ...u.roles.map((sr) => { const r = roles.find((x) => x.id === sr.role_id); return r ? `${r.emoji} ${r.name}` : null; }),
    ].filter(Boolean).join(" · ");

// ---------------------------------------------------------------- group admins (shared)
const CANT_ADD = ["privacy", "unknown_user"];  // adding can't work for this person: only an invite link can
const GST_KIND = { owner: "acc", admin: "ok", admin_other: "ok", member: "", absent: "warn", unknown: "bad" };

/** Telegram's own people picker (any contact or chat member, whether or not they use the bot).
 * Telegram reports the choice to the bot, and the Mini App reads it back. Resolves to {id, name, username} or null. */
async function pickPerson() {
  if (!canTg("9.6") || !tg.requestChat) { await alertMsg(t("ga_update_tg")); return null; }
  const { id, request_id } = await api("admins.pick");
  const sent = await new Promise((ok) => { try { tg.requestChat(id, (done) => ok(!!done)); } catch { ok(false); } });
  if (!sent) return null;
  for (let i = 0; i < 15; i++) {
    const person = await api("admins.picked", { request_id });
    if (person) return person;
    await new Promise((r) => setTimeout(r, 700));
  }
  throw new Error(t("ga_pick_failed"));
}

async function setAdmin(person, groups, value) {
  const results = await api("admins.set", { user_id: person.id, chat_ids: groups.map((g) => g.chat_id), value });
  for (const r of results) if (r.result === "ok") groups.find((g) => g.chat_id === r.chat_id).status = value ? "admin" : "member";
  return results;
}

async function reportResults(results) {
  const failed = results.filter((r) => r.result !== "ok");
  haptic(failed.length ? "warning" : "ok");
  if (results.length > failed.length) toast(t("gadm_done", { n: results.length - failed.length }));
  if (failed.length) await alertMsg((results.length > 1 ? t("gadm_failed") + "\n" : "") + failed.map((r) => (results.length > 1 ? r.label + ": " : "") + r.message).join("\n"));
}

/** One person's admin status in every class group. The admin ticks the groups to make them an
 * admin in (nothing is ticked to begin with) and confirms; where the bot made them an admin, it can undo it. */
function adminPanel(person) {
  const box = el("div", { class: "card" }, el("div", { class: "skel", style: "height:56px;margin:12px" }), el("div", { class: "skel", style: "height:56px;margin:12px" }));
  let list = [];
  const chosen = new Set();
  const remove = async (g) => {
    if (!(await confirmMsg(t("ga_remove_confirm", { name: person.name, group: g.label })))) return;
    await reportResults(await setAdmin(person, [g], false)); draw();
  };
  // Ticked groups they aren't in yet: added first through the connected account, then made admin.
  const promote = async (button) => {
    const groups = list.filter((g) => chosen.has(g.chat_id));
    const absent = groups.filter((g) => g.status === "absent");
    if (!(await confirmMsg(t(absent.length ? "ga_confirm_add" : "ga_confirm", { name: person.name, groups: groups.map((g) => g.label).join(", ") })))) return;
    const failed = (absent.length ? await addChunks(absent, button) : []).filter((r) => r.result !== "ok");
    const ready = groups.filter((g) => g.status === "member");
    const results = ready.length ? await setAdmin(person, ready, true) : [];
    chosen.clear(); draw(); await reportResults([...failed, ...results]);
  };
  // Removing them from ticked groups. Tucked away behind a button, and asked twice.
  let kicking = false;
  const kickChosen = new Set();
  const kickSection = () => {
    const present = list.filter((g) => g.status === "member" || g.status === "admin");
    if (!present.length) return el("div");
    const open = el("button", { class: "btn ghost block", type: "button", style: "color:var(--danger)", onclick: () => { kicking = !kicking; kickChosen.clear(); haptic(); draw(); } },
      icon(kicking ? "x" : "trash"), t(kicking ? "cancel" : "kick_open"));
    if (!kicking) return el("div", { style: "padding:0 16px 16px" }, open);
    const allOn = present.every((g) => kickChosen.has(g.chat_id));
    const go = el("button", { class: "btn danger block", type: "button", disabled: !kickChosen.size, onclick: () => act(go, async () => {
      const groups = present.filter((g) => kickChosen.has(g.chat_id));
      if (!(await confirmMsg(t("kick_confirm", { name: person.name, groups: groups.map((g) => g.label).join(", ") })))) return;
      if (!(await confirmMsg(t("kick_sure", { name: person.name, n: groups.length })))) return;
      const results = await api("admins.kick", { user_id: person.id, chat_ids: groups.map((g) => g.chat_id) });
      for (const r of results) if (r.result === "ok") { const g = list.find((x) => x.chat_id === r.chat_id); g.status = "absent"; g.invite = null; }
      kicking = false; kickChosen.clear(); draw(); await reportResults(results);
    }) }, icon("trash"), kickChosen.size ? t("kick_n", { n: kickChosen.size }) : t("ga_tick"));
    return el("div", { style: "border-top:1px solid var(--line)" }, el("div", { class: "hint", style: "margin:12px 16px 4px" }, t("kick_hint")),
      present.map((g) => {
        const on = kickChosen.has(g.chat_id);
        return row({ lead: el("span", { class: "tick" + (on ? " on" : "") }, on ? icon("check") : null), title: g.label,
          onclick: () => { on ? kickChosen.delete(g.chat_id) : kickChosen.add(g.chat_id); haptic(); draw(); } });
      }),
      el("div", { style: "padding:8px 16px 16px" },
        present.length > 1 ? el("button", { class: "btn soft sm", type: "button", style: "margin-bottom:10px", onclick: () => {
          present.forEach((g) => (allOn ? kickChosen.delete(g.chat_id) : kickChosen.add(g.chat_id))); haptic(); draw();
        } }, allOn ? t("ga_clear") : t("ga_select_all")) : null, go, el("div", { class: "mt" }), open));
  };
  // Into every group they aren't in, through the connected Telegram account; a few at a time, with progress.
  const addChunks = async (groups, button) => {
    const near = list.filter((g) => ["member", "admin", "admin_other", "owner"].includes(g.status)).map((g) => g.chat_id).slice(0, 3);
    const results = [];
    for (let i = 0; i < groups.length; i += 4) {
      button.textContent = t("uadd_progress", { n: i, total: groups.length });
      const r = await api("admins.add", { user_id: person.id, chat_ids: groups.slice(i, i + 4).map((g) => g.chat_id), near });
      results.push(...r.results);
      for (const x of r.results) {
        const g = list.find((y) => y.chat_id === x.chat_id);
        if (x.result === "ok") { g.status = "member"; g.invite = null; }
        else if (CANT_ADD.includes(x.result)) { g.addFailed = true; chosen.delete(g.chat_id); }  // an invite link is the way now
      }
      if (r.stop) break;
    }
    return results;
  };
  const addToGroups = async (groups, button) => {
    const how = await chooseMsg(t("uadd_ask", { name: person.name, n: groups.length }),
      [["admin", t("uadd_as_admin")], ["member", t("uadd_as_member")]]);
    if (!how) return;
    const results = await addChunks(groups, button);
    if (how === "member") { draw(); await reportResults(results); return; }
    const added = groups.filter((g) => g.status === "member");
    const promoted = added.length ? await setAdmin(person, added, true) : [];
    draw(); await reportResults([...results.filter((r) => r.result !== "ok"), ...promoted]);
  };
  const draw = () => {
    const accountReady = !!(cached("me") || {}).account_ready;
    // Someone not in the group can be ticked too: the connected account adds them first.
    const tickable = (g) => g.status === "member" || (g.status === "absent" && accountReady && !g.addFailed);
    const members = list.filter(tickable);
    const rows = list.map((g) => {
      const on = chosen.has(g.chat_id);
      const needsLink = g.status === "absent" && !tickable(g);
      const kind = tickable(g) ? (on ? " on" : "") : g.status === "admin" || g.status === "admin_other" || g.status === "owner" ? " done" : " off";
      let side = null;
      if (g.status === "admin") side = el("button", { class: "btn danger sm", type: "button", onclick: (e) => act(e.currentTarget, () => remove(g)) }, t("ga_remove"));
      // Not in the group: a link for them alone; joining through it makes them an admin.
      else if (needsLink && g.invite) side = el("div", { class: "btns" },
        el("button", { class: "icon-btn", style: "box-shadow:none;background:var(--surface-2)", type: "button", "aria-label": t("copy"), onclick: () => copyText(g.invite) }, icon("copy")),
        el("button", { class: "icon-btn", style: "box-shadow:none;background:var(--accent-soft);color:var(--accent)", type: "button", "aria-label": t("share"),
          onclick: () => share(g.invite, t("ga_invite_text", { group: g.label })) }, icon("share")));
      else if (needsLink) side = el("button", { class: "btn soft sm", type: "button", onclick: (e) => act(e.currentTarget, async () => {
        g.invite = (await api("admins.invite", { user_id: person.id, chat_id: g.chat_id })).link;
        haptic("ok"); draw(); share(g.invite, t("ga_invite_text", { group: g.label }));
      }) }, t("ga_invite"));
      return row({
        lead: el("span", { class: "tick" + kind }, on || kind === " done" ? icon("check") : null),
        title: g.label,
        sub: [badge(t("gst_" + g.status), GST_KIND[g.status]), needsLink && g.invite ? el("div", { style: "margin-top:4px" }, t("ga_invite_sent")) : null],
        side,
        onclick: tickable(g) ? () => { on ? chosen.delete(g.chat_id) : chosen.add(g.chat_id); haptic(); draw(); } : null,
      });
    });
    const allOn = members.length && members.every((g) => chosen.has(g.chat_id));
    const absent = list.filter((g) => g.status === "absent" && !g.addFailed);
    const addAll = accountReady && absent.length ? el("button", { class: "btn soft block", type: "button", style: "margin-bottom:10px",
      onclick: () => act(addAll, () => addToGroups(absent, addAll)) }, icon("plus"), t("uadd_all", { n: absent.length })) : null;
    const go = el("button", { class: "btn block", type: "button", disabled: !chosen.size, onclick: () => act(go, () => promote(go)) },
      chosen.size ? t("ga_promote", { n: chosen.size }) : t("ga_tick"));
    box.replaceChildren(...(rows.length ? rows : [empty(t("gadm_no_groups"), "school")]),
      el("div", { style: "padding:8px 16px 16px" }, addAll,
        !members.length ? el("div", { class: "hint", style: "margin:0" }, t("ga_nowhere")) : [
          members.length > 1 ? el("button", { class: "btn soft sm", type: "button", style: "margin-bottom:10px", onclick: () => {
            members.forEach((g) => (allOn ? chosen.delete(g.chat_id) : chosen.add(g.chat_id))); haptic(); draw();
          } }, allOn ? t("ga_clear") : t("ga_select_all")) : null,
          go]), kickSection());
  };
  api("admins.status", { user_id: person.id })
    .then((l) => { list = l; draw(); })
    .catch((e) => box.replaceChildren(empty(e.message || t("error"), "alert")));
  return box;
}

    flat: true, title: t("perm_" + perm), sub: perm === "admin" && u.is_super ? t("main_admin") : null,
    side: toggle(u[PERM_KEY[perm]], (value, input) => act(null, async () => {
      try { Object.assign(u, await api("staff.set_perm", { user_id: u.id, perm, value })); invalidate("users", "dashboard"); haptic("ok"); toast(t("saved")); }
      catch (e) { input.checked = !value; throw e; }
    })),
  });
  const rolesBox = el("div", { class: "card" });
  const drawRoles = () => rolesBox.replaceChildren(...(u.roles.length ? u.roles.map((sr) => {
    const r = roles.find((x) => x.id === sr.role_id);
    return row({
      lead: lead(r ? r.emoji : "❔"), title: r ? r.name : "—", sub: sr.floor_id ? floorName(floors, sr.floor_id) : t("all_floors"),
      side: el("button", { class: "icon-btn", style: "box-shadow:none;background:var(--danger-soft);color:var(--danger)", type: "button",
        onclick: (e) => act(e.currentTarget, async () => {
          Object.assign(u, await api("staff.remove_role", { user_id: u.id, role_id: sr.role_id, floor_id: sr.floor_id }));
          invalidate("users", "roles"); haptic("ok"); drawRoles();
        }) }, icon("x")),
    });
  }) : [empty("—", "tag")]));
  drawRoles();

  const roleSel = select(roles.map((r) => [r.id, `${r.emoji} ${r.name}`]), roles[0] && roles[0].id, t("role"));
  const floorSel = select([["", t("all_floors")], ...floors.map((f) => [f.id, f.name])], "", t("floor"));
  const addBtn = el("button", { class: "btn block mt", type: "button", onclick: () => act(addBtn, async () => {
    const args = { user_id: u.id, role_id: Number(roleSel.value) };
    if (floorSel.value) args.floor_id = Number(floorSel.value);
    Object.assign(u, await api("staff.add_role", args));
    invalidate("users", "roles"); haptic("ok"); toast(t("saved")); drawRoles();
  }) }, icon("plus"), t("add"));

  // Admin rights in the class groups, given by the bot; loaded on demand (one Telegram check per group).
  const gadmBox = el("div");
  const gadmLoad = el("button", { class: "btn soft block", type: "button", onclick: () => gadmBox.replaceChildren(adminPanel(u)) },
    icon("school"), t("gadm_load"));
  gadmBox.replaceChildren(el("div", { class: "hint", style: "margin:0 2px 10px" }, t("gadm_hint")), gadmLoad);

  openSheet(u.name,
    el("div", { style: "display:flex;align-items:center;gap:12px;margin:4px 0 6px" }, avatar(u.name, u.id),
      el("div", { class: "hint", style: "margin:0" }, [u.username ? "@" + u.username : null, "ID " + u.id, u.is_me ? t("you") : null].filter(Boolean).join(" · "))),
    header(t("rights")), card(["admin", "announcer", "teacher"].map(permRow)),
    header(t("gadm_title")), gadmBox,
    header(t("user_roles")), rolesBox,
    header(t("add_role")),
    roles.length ? card(el("div", { style: "padding:2px 16px 16px" }, field(t("role"), roleSel), floors.length ? field(t("floor"), floorSel) : null, addBtn))
      : card(empty(t("no_roles_yet"), "tag")));
  sheetCloseHook = () => { if (state.tab === "staff" && !state.sub) render(); };
}

// ---- one sent announcement: edit its text in every group, delete it from chosen groups
async function openAnnouncement(a, shareStory) {
  const d = await api("announce.get", { id: a.id });
  const refresh = () => { invalidate("annHistory"); if (state.tab === "announce" && !state.sub) render(); };

  // Edit
  let editBox = null, saveBtn = null;
  if (d.editable) {
    const editor = el("div", { class: "editor", contenteditable: "true", role: "textbox", "aria-multiline": "true", style: "min-height:110px" });
    editor.append(tgToNodes(d.html));
    const counter = el("div", { class: "hint", style: "text-align:right" });
    const count = () => { const n = editorToTg(editor).plain.length; counter.textContent = `${n}/${d.limit}`; counter.style.color = n > d.limit ? "var(--warn)" : ""; };
    editor.addEventListener("input", count);
    editor.addEventListener("paste", (e) => { e.preventDefault(); document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text/plain")); });
    count();
    const save = el("button", { class: "btn block mt", type: "button", onclick: () => act(save, async () => {
      const { html } = editorToTg(editor);
      if (!(await confirmMsg(t("ann_edit_confirm", { n: d.groups.length })))) return;
      const r = await api("announce.edit", { id: a.id, html });
      d.html = html; haptic(r.failed.length ? "warning" : "ok"); toast(t("ann_edited", { n: r.edited, total: r.total }));
      if (r.failed.length) await alertMsg(t("ann_edit_failed", { list: r.failed.join(", ") }));
      refresh();
    }) }, t("ann_edit_save", { n: d.groups.length }));
    saveBtn = save;
    editBox = [header(t("ann_edit")), card(el("div", { style: "padding:12px 14px 14px" }, editor, counter)), save,
      el("div", { class: "hint", style: "margin:8px 2px 0" }, t("ann_edit_hint"))];
  } else if (!d.deleted && d.groups.length) {
    editBox = [header(t("ann_edit")), card(el("div", { class: "hint", style: "padding:14px 16px;margin:0" }, t("ann_not_editable")))];
  }

  // Delete from chosen groups
  const chosen = new Set();
  const delBox = el("div");
  const drawDel = () => {
    const allOn = d.groups.length && d.groups.every((g) => chosen.has(g.chat_id));
    const go = el("button", { class: "btn danger block", type: "button", disabled: !chosen.size, onclick: () => act(go, async () => {
      const picked = d.groups.filter((g) => chosen.has(g.chat_id));
      if (!(await confirmMsg(t("ann_del_confirm", { groups: picked.map((g) => g.label).join(", ") })))) return;
      const r = await api("announce.delete", { id: a.id, chat_ids: picked.map((g) => g.chat_id) });
      d.groups = d.groups.filter((g) => !chosen.has(g.chat_id)); chosen.clear();
      haptic("ok"); toast(t("ann_deleted", { n: r.deleted, total: r.total }));
      if (r.all_gone) { closeSheet(); refresh(); return; }
      if (saveBtn) saveBtn.textContent = t("ann_edit_save", { n: d.groups.length });
      drawDel(); refresh();
    }) }, icon("trash"), chosen.size ? t("ann_del_n", { n: chosen.size }) : t("ann_del_pick"));
    delBox.replaceChildren(
      header(t("ann_del_title")),
      card(...d.groups.map((g) => {
        const on = chosen.has(g.chat_id);
        return row({ lead: el("span", { class: "tick" + (on ? " on" : "") }, on ? icon("check") : null), title: g.label,
          onclick: () => { on ? chosen.delete(g.chat_id) : chosen.add(g.chat_id); haptic(); drawDel(); } });
      }), el("div", { style: "padding:8px 16px 16px" },
        d.groups.length > 1 ? el("button", { class: "btn soft sm", type: "button", style: "margin-bottom:10px", onclick: () => {
          d.groups.forEach((g) => (allOn ? chosen.delete(g.chat_id) : chosen.add(g.chat_id))); haptic(); drawDel();
        } }, allOn ? t("ga_clear") : t("ga_select_all")) : null, go)));
  };
  if (!d.deleted && d.groups.length) drawDel();

  openSheet(t("ann_sheet"),
    el("div", { class: "hint", style: "margin:0 2px" }, `${fmtTime(a.created_at)} · ${a.author || ""} · ${t("ann_groups", { n: d.groups.length })}`),
    d.deleted ? el("div", { class: "mt" }, badge(t("ann_deleted_badge"), "bad")) : null,
    editBox, delBox,
    a.story_url ? el("button", { class: "btn soft block mt", type: "button", onclick: () => shareStory(a) }, icon("story"), t("story_share")) : null);
}

function openGroup(g, floors) {
  const cls = el("input", { class: "in", value: g.class_name || "", placeholder: "7-B", maxLength: 16 });
  const floor = select([["", t("no_floor")], ...floors.map((f) => [f.id, f.name])], g.floor_id ?? "", t("floor"));
  const lang = select([["uz", "O'zbekcha"], ["ru", "Русский"], ["en", "English"]], g.lang, t("lang"));
  // Groups with topics: where announcements go. The bot learns topics from messages written in them.
  const topic = g.topics.length ? select([["", "General"], ...g.topics.map((tp) => [tp.id, tp.name])], g.announce_thread_id ?? "", t("topic")) : null;
  const save = el("button", { class: "btn block mt", type: "button", onclick: () => act(save, async () => {
    const args = { chat_id: g.chat_id, floor_id: floor.value ? Number(floor.value) : null, lang: lang.value };
    if (topic) args.announce_thread_id = topic.value ? Number(topic.value) : null;
    if (cls.value.trim() && cls.value.trim() !== g.class_name) args.class_name = cls.value;
    await api("groups.update", args);
    invalidate("groups", "floors", "dashboard"); haptic("ok"); toast(t("saved")); closeSheet(); render();
  }) }, t("save"));
  const adminsBox = el("div", { class: "card" }, el("div", { class: "skel", style: "height:56px;margin:12px" }));
  const loadAdmins = () => api("groups.admins", { chat_id: g.chat_id }).then((admins) => adminsBox.replaceChildren(...(admins.length ? admins.map((a) => row({
    lead: avatar(a.name, a.id), title: a.name,
    sub: [a.username ? "@" + a.username + " " : null, badge(t("gst_" + a.status), GST_KIND[a.status])],
    side: a.status === "admin" ? el("button", { class: "btn danger sm", type: "button", onclick: (e) => act(e.currentTarget, async () => {
      if (!(await confirmMsg(t("ga_remove_confirm", { name: a.name, group: groupLabel(g) })))) return;
      await reportResults(await setAdmin(a, [{ chat_id: g.chat_id, label: groupLabel(g) }], false)); loadAdmins();
    }) }, t("ga_remove")) : null,
  })) : [empty(t("grp_admins_none"), "users")]))).catch((e) => adminsBox.replaceChildren(empty(e.message || t("error"), "alert")));
  loadAdmins();
  const addAdmin = el("button", { class: "btn soft block mt", type: "button", onclick: () => act(addAdmin, async () => {
    const p = await pickPerson();
    if (!p || !(await confirmMsg(t("grp_add_confirm", { name: p.name, group: groupLabel(g) })))) return;
    const target = () => [{ chat_id: g.chat_id, label: groupLabel(g) }];
    let results = await setAdmin(p, target(), true);
    if (results[0] && results[0].result === "not_member" && (cached("me") || {}).account_ready) {
      const added = (await api("admins.add", { user_id: p.id, chat_ids: [g.chat_id] })).results;
      if (added[0].result === "ok") results = await setAdmin(p, target(), true);
      else if (!CANT_ADD.includes(added[0].result)) { await reportResults(added); return; }
    }
    if (results[0] && results[0].result === "not_member") {
      // Not in the group yet: offer a link for them alone; joining through it makes them an admin.
      if (!(await confirmMsg(t("grp_invite_confirm", { name: p.name, group: groupLabel(g) })))) return;
      const { link } = await api("admins.invite", { user_id: p.id, chat_id: g.chat_id });
      haptic("ok"); share(link, t("ga_invite_text", { group: groupLabel(g) }));
      return;
    }
    await reportResults(results); loadAdmins();
  }) }, icon("plus"), t("grp_add_admin"));
  // Takes the group off the bot (the bot leaves it). Asked twice: the school relies on these groups.
  const removeGroup = el("button", { class: "btn danger block", type: "button", style: "margin-top:28px", onclick: () => act(removeGroup, async () => {
    if (!(await confirmMsg(t("grp_remove_confirm", { group: groupLabel(g) })))) return;
    if (!(await confirmMsg(t("grp_remove_sure", { group: groupLabel(g) })))) return;
    cache.groups = { data: await api("groups.remove", { chat_id: g.chat_id }), at: Date.now() };
    invalidate("dashboard"); haptic("ok"); toast(t("grp_removed", { group: groupLabel(g) })); closeSheet(); render();
  }) }, icon("trash"), t("grp_remove"));
  openSheet(groupLabel(g), el("div", { class: "hint", style: "margin:0 2px" }, g.title),
    field(t("class"), cls), field(t("floor"), floor), field(t("lang"), lang),
    topic ? field(t("topic"), topic, t("topic_hint")) : null, save,
    header(t("grp_admins")), adminsBox, addAdmin, removeGroup);
}

function openRole(r) {
  const key = el("input", { class: "in", placeholder: "cleaner", maxLength: 32, autocapitalize: "off" });
  const emoji = el("input", { class: "in", value: r ? r.emoji : "", placeholder: "🧹", maxLength: 16 });
  const name = el("input", { class: "in", value: r ? r.name : "", placeholder: "Tozalovchi", maxLength: 64 });
  if (!r) {
    const create = el("button", { class: "btn block mt", type: "button", onclick: () => act(create, async () => {
      await api("roles.create", { key: key.value, emoji: emoji.value, name: name.value });
      invalidate("roles", "dashboard"); haptic("ok"); toast(t("saved")); closeSheet(); render();
    }) }, t("create"));
    return openSheet(t("new_role"), field(t("key"), key, t("key_hint")),
      el("div", { class: "btns" }, el("div", { style: "flex:1" }, field(t("emoji"), emoji)), el("div", { style: "flex:2.5" }, field(t("name"), name))), create);
  }
  const aliases = el("input", { class: "in", value: r.aliases.join(" "), autocapitalize: "off" });
  let floorBased = r.floor_based;
  const save = el("button", { class: "btn block mt", type: "button", onclick: () => act(save, async () => {
    await api("roles.update", { id: r.id, emoji: emoji.value, name: name.value, floor_based: floorBased,
      aliases: aliases.value.split(/[\s,]+/).filter(Boolean) });
    invalidate("roles"); haptic("ok"); toast(t("saved")); closeSheet(); render();
  }) }, t("save"));
  const del = el("button", { class: "btn danger block mt", type: "button", onclick: () => act(del, async () => {
    if (!(await confirmMsg(t("del_role_confirm", { name: r.name })))) return;
    await api("roles.delete", { id: r.id });
    invalidate("roles", "dashboard", "users"); haptic("ok"); closeSheet(); render();
  }) }, icon("trash"), t("delete"));
  const invite = el("button", { class: "btn soft block mt", type: "button", onclick: () => { state.invitePreset = "role:" + r.id; go("more", "invites"); } },
    icon("link"), t("invite_for_role"));
  openSheet(`${r.emoji} ${r.name}`, el("div", { class: "hint", style: "margin:0 2px" }, "#" + r.key),
    el("div", { class: "btns" }, el("div", { style: "flex:1" }, field(t("emoji"), emoji)), el("div", { style: "flex:2.5" }, field(t("name"), name))),
    field(t("aliases"), aliases, t("aliases_hint")),
    el("div", { class: "mt" }), card(row({ flat: true, title: t("floor_based"), sub: t("floor_based_hint"), side: toggle(floorBased, (v) => { floorBased = v; haptic(); }) })),
    save, invite, del);
}

function openFloor(f) {
  const name = el("input", { class: "in", value: f.name, maxLength: 64 });
  const save = el("button", { class: "btn block mt", type: "button", onclick: () => act(save, async () => {
    await api("floors.rename", { id: f.id, name: name.value });
    invalidate("floors", "groups"); haptic("ok"); toast(t("saved")); closeSheet(); render();
  }) }, t("save"));
  const del = el("button", { class: "btn danger block mt", type: "button", onclick: () => act(del, async () => {
    if (!(await confirmMsg(t("del_floor_confirm", { name: f.name })))) return;
    await api("floors.delete", { id: f.id });
    invalidate("floors", "groups", "dashboard"); haptic("ok"); closeSheet(); render();
  }) }, icon("trash"), t("delete"));
  openSheet(f.name, el("div", { class: "hint", style: "margin:0 2px" }, f.classes.join(", ") || t("classes_n", { n: 0 })),
    field(t("rename"), name), save, del);
}

// ---------------------------------------------------------------- start
(async function start() {
  const dark = tg && tg.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  if (tg) {
    tg.ready(); tg.expand();
    // Custom hex colors for Telegram's header need Bot API 6.9+.
    if (canTg("6.9")) { const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim(); tg.setHeaderColor(bg); tg.setBackgroundColor(bg); }
    if (tg.onEvent) tg.onEvent("themeChanged", () => { document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light"; });
  }
  if (!initData) {
    $("app").replaceChildren(el("div", { class: "center" }, icon("school"), t("open_in_tg")));
    return;
  }
  $("app").replaceChildren(skeleton());
  try {
    // Everything the first screens need, in parallel.
    const [me] = await Promise.all([load("me", "me"), load("dashboard", "dashboard"),
      load("groups", "groups.list").catch(() => null), load("roles", "roles.list").catch(() => null), load("floors", "floors.list").catch(() => null)]);
    L = T[me.lang] ? me.lang : "uz";
    loadAnnDraft();
    document.documentElement.lang = L;
    $("nav").hidden = false;
    await render();
  } catch (e) {
    $("app").replaceChildren(el("div", { class: "center" }, icon("alert"), e.message || t("error")));
  }
})();
